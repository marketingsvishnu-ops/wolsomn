```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEROFIT — Performance Gym</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
    }

    :root{
      --blue:#1464ff;
      --cyan:#00c6ff;
      --dark:#08111f;
      --text:#172235;
      --muted:#718096;
      --light:#f4f8fc;
      --white:#ffffff;
      --border:#e5edf5;
    }

    body{
      font-family:"DM Sans",sans-serif;
      color:var(--text);
      background:#fff;
      overflow-x:hidden;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    /* NAVBAR */
    nav{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      width:min(1160px,92%);
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,.86);
      backdrop-filter:blur(20px);
      border:1px solid rgba(210,222,235,.8);
      border-radius:18px;
      z-index:1000;
      box-shadow:0 15px 40px rgba(25,60,100,.08);
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-family:"Space Grotesk";
      font-size:23px;
      font-weight:800;
      letter-spacing:-1px;
    }

    .logo-icon{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      color:white;
      background:linear-gradient(135deg,var(--blue),var(--cyan));
      border-radius:11px;
      font-weight:900;
      box-shadow:0 8px 20px rgba(20,100,255,.25);
    }

    .nav-links{
      display:flex;
      gap:30px;
      font-size:14px;
      font-weight:600;
      color:#536174;
    }

    .nav-links a{
      transition:.3s;
    }

    .nav-links a:hover{
      color:var(--blue);
    }

    .nav-btn{
      background:var(--dark);
      color:white;
      padding:11px 19px;
      border-radius:11px;
      font-weight:700;
      font-size:14px;
      transition:.3s;
    }

    .nav-btn:hover{
      transform:translateY(-2px);
      background:var(--blue);
    }

    /* HERO */
    .hero{
      min-height:820px;
      padding-top:170px;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 85% 20%,rgba(0,198,255,.12),transparent 28%),
        radial-gradient(circle at 20% 60%,rgba(20,100,255,.08),transparent 30%),
        #f7fbff;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:60px;
      align-items:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 13px;
      background:white;
      border:1px solid var(--border);
      border-radius:30px;
      color:var(--blue);
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      box-shadow:0 8px 25px rgba(40,80,120,.05);
    }

    .pulse{
      width:7px;
      height:7px;
      background:#18d77b;
      border-radius:50%;
      box-shadow:0 0 0 6px rgba(24,215,123,.1);
    }

    h1{
      margin-top:24px;
      font-family:"Space Grotesk";
      font-size:clamp(52px,7vw,92px);
      line-height:.94;
      letter-spacing:-5px;
      max-width:720px;
    }

    h1 span{
      color:var(--blue);
    }

    .hero-text{
      margin-top:26px;
      max-width:580px;
      color:var(--muted);
      font-size:18px;
      line-height:1.7;
    }

    .hero-actions{
      display:flex;
      gap:14px;
      margin-top:35px;
    }

    .primary-btn{
      padding:15px 23px;
      border-radius:12px;
      background:var(--blue);
      color:white;
      font-weight:800;
      box-shadow:0 12px 30px rgba(20,100,255,.25);
      transition:.3s;
    }

    .primary-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 18px 35px rgba(20,100,255,.3);
    }

    .secondary-btn{
      padding:15px 23px;
      border:1px solid #d9e4ef;
      background:white;
      border-radius:12px;
      font-weight:800;
      transition:.3s;
    }

    .secondary-btn:hover{
      border-color:var(--blue);
      color:var(--blue);
    }

    /* HERO VISUAL */
    .hero-visual{
      position:relative;
      min-height:500px;
    }

    .athlete-card{
      position:absolute;
      inset:35px 20px 35px 50px;
```
